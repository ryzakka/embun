name: Embun
description: "Menjaga Hayu Menjauhkan si Terbisik."
publish_to: 'none'

version: 2.7.17+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  audioplayers: ^6.1.0
  flame: ^1.35.1
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo/ikonapp-transparent.webp"
  adaptive_icon_background: "#FFFFFF" # Ganti warna hex ini jika ingin latar belakang selain putih
  adaptive_icon_foreground: "assets/logo/ikonapp-transparent.webp"

flutter:
  uses-material-design: true
  assets:
    - assets/bentang/
    - assets/pohon/
    - assets/kartu/CharPro/CharPro-Pria/
    - assets/kartu/CharPro/CharPro-Wanita/
    - assets/kartu/CharAnta/
    - assets/kartu/ItemPro/
    - assets/kartu/ItemProDay/
    - assets/kartu/ItemAnta/
    - assets/kartu/ItemAntaNight/
    - assets/kartu/ItemAntaRekayasa/
    - assets/kartu/ItemProRegenerasi/
    - assets/kartu/punggungkartu/
    - assets/kartu/CharSkill/
    - assets/logo/
    - assets/ikon/
    - assets/sound/

  shaders:
    - shaders/cloth.frag
    - shaders/atmosphere.frag
    - shaders/card_morph.frag
    - shaders/omen_sky.frag
    - shaders/divine.frag
    - shaders/vote_reveal.frag
    - shaders/prologue_fx.frag